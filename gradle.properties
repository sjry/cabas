org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Si la compilation échoue sur « No native library found for os.name=Linux », c'est que
# /tmp est monté noexec : sqlite-jdbc, utilisé par Room pour vérifier les requêtes à la
# compilation, ne peut pas y extraire sa bibliothèque native. Lui donner un répertoire
# temporaire exécutable dans ~/.gradle/gradle.properties — un chemin absolu ne vaut que
# pour un poste, il n'a rien à faire dans un dépôt public :
#   kotlin.daemon.jvmargs=-Xmx2048m -Dorg.sqlite.tmpdir=<dir> -Djava.io.tmpdir=<dir>
kotlin.daemon.jvmargs=-Xmx2048m
