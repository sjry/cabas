org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# /tmp est monté noexec sur cette machine : sqlite-jdbc, utilisé par Room pour
# vérifier les requêtes à la compilation, ne peut pas y extraire sa bibliothèque
# native. On lui donne un répertoire temporaire exécutable.
kotlin.daemon.jvmargs=-Xmx2048m -Dorg.sqlite.tmpdir=/home/sjarry/.cache/gradle-native-tmp -Djava.io.tmpdir=/home/sjarry/.cache/gradle-native-tmp
