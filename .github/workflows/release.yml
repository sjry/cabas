# Publie un APK signé dans une release GitHub, téléchargeable depuis un téléphone :
# https://github.com/sjry/cabas/releases/latest
#
# Déclenchement : `git tag v1.1 && git push origin v1.1`, ou manuellement depuis
# l'onglet Actions (la release est alors nommée d'après le numéro de build).
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Les secrets de signature vivent dans l'environment « prod » : sans cette ligne,
    # GitHub n'injecte que les secrets du dépôt et `secrets.KEYSTORE_BASE64` est vide.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Déterminer la version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-build$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # Reconstitue keystore.properties comme en local (cf. app/build.gradle.kts) à partir
      # des secrets du dépôt. Sans eux la build release serait non signée, donc non
      # installable : mieux vaut échouer ici avec un message clair.
      - name: Restaurer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent — voir « Publier une nouvelle version » dans le README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cabas.jks"
          {
            echo "storeFile=$RUNNER_TEMP/cabas.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

#      - name: Tests
#        run: ./gradlew test

      - name: Construire l'APK
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ github.run_number }}

      - name: Vérifier la signature et renommer
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          # Plusieurs build-tools peuvent cohabiter : un glob passerait le second
          # chemin en argument à apksigner. On prend explicitement le plus récent.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mv "$apk" "cabas-${{ steps.version.outputs.name }}.apk"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.name) }}"
          gh release create "$tag" "cabas-${{ steps.version.outputs.name }}.apk" \
            --title "Cabas ${{ steps.version.outputs.name }}" \
            --notes "APK signé, à installer directement sur le téléphone : télécharger le fichier .apk ci-dessous et l'ouvrir." \
            --latest
